name: Release native MarkText

on:
  workflow_dispatch:
    inputs:
      marktext-ref:
        description: MarkText tag to build from marktext/marktext; releases are tagged <tag>.1, <tag>.2, ...
        required: true
        default: v0.20.0
      nativeboat-version:
        description: NativeBoat release tag, or latest
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.marktext-ref }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      marktext-ref: ${{ inputs.marktext-ref }}
      nativeboat-version: ${{ inputs.nativeboat-version }}

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: marktext-native-win-x64
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.build.outputs.marktext-ref }}
          NATIVEBOAT: ${{ needs.build.outputs.nativeboat-version }}
          COMMIT: ${{ needs.build.outputs.marktext-commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Every build gets its own release, tagged with the MarkText tag plus
          # a build number (v0.20.0.1, v0.20.0.2, ...), so a rebuild never
          # replaces an earlier release.
          $prefix = "refs/tags/$env:REF."
          $last = gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:REF." --jq '.[].ref' |
            Where-Object { $_.StartsWith($prefix) -and $_.Substring($prefix.Length) -match '^\d+$' } |
            ForEach-Object { [int]$_.Substring($prefix.Length) } |
            Measure-Object -Maximum
          $tag = "$env:REF.$([int]$last.Maximum + 1)"
          "Release tag: $tag"

          # Name the ZIP after the release, and list it under that name.
          Get-ChildItem release -Filter "*-$env:REF-*.zip" |
            Rename-Item -NewName { $_.Name.Replace("-$env:REF-", "-$tag-") }
          Get-ChildItem release -Filter *.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

          @"
          Native Windows x64 build of [MarkText $env:REF](https://github.com/marktext/marktext/releases/tag/$env:REF)
          (source commit marktext/marktext@$env:COMMIT), compiled with
          [NativeBoat $env:NATIVEBOAT](https://github.com/XTSoftwareLabs/nativeboat-release/releases/tag/$env:NATIVEBOAT).

          The executable runs without Chromium, WebView2 or Node.js. Download the
          ``.zip``, extract the whole folder, and run ``MarkText.exe`` from it; the
          executable needs the other files in that folder.
          "@ | Set-Content -Encoding utf8NoBOM notes.md
          $files = (Get-ChildItem release -File).FullName
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "MarkText $tag (native Windows)" --notes-file notes.md
