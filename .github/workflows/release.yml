name: Release native MarkText

on:
  workflow_dispatch:
    inputs:
      marktext-ref:
        description: MarkText tag to build from marktext/marktext; also the release tag
        required: true
        default: v0.20.0
      nativeboat-version:
        description: NativeBoat release tag, or latest
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.marktext-ref }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      marktext-ref: ${{ inputs.marktext-ref }}
      nativeboat-version: ${{ inputs.nativeboat-version }}

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: marktext-native-win-x64
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.marktext-ref }}
          NATIVEBOAT: ${{ needs.build.outputs.nativeboat-version }}
          COMMIT: ${{ needs.build.outputs.marktext-commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          @"
          Native Windows x64 build of [MarkText $env:TAG](https://github.com/marktext/marktext/releases/tag/$env:TAG)
          (source commit marktext/marktext@$env:COMMIT), compiled with
          [NativeBoat $env:NATIVEBOAT](https://github.com/XTSoftwareLabs/nativeboat-release/releases/tag/$env:NATIVEBOAT).

          The executable runs without Chromium, WebView2 or Node.js. Download the
          ``.exe`` to run it directly, or the ``.zip`` for the complete output folder.
          "@ | Set-Content -Encoding utf8NoBOM notes.md
          $files = (Get-ChildItem release -File).FullName
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          # Fail on any gh error from here on.
          $PSNativeCommandUseErrorActionPreference = $true
          if ($exists) {
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file notes.md
            gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
              --title "MarkText $env:TAG (native Windows)" --notes-file notes.md
          }
